<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SketchNote - Flask Excalidraw Clone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js for interactive HTML5 Canvas drawing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/535/fabric.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Top Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-black text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-pen-nib"></i> SketchNote
            </h1>
            <input type="text" id="note-title" value="{% if current_note %}{{ current_note['title'] }}{% else %}My Awesome Sketch{% endif %}" 
                   class="bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-indigo-500 text-sm font-medium">
            {% if current_note %}
            <span class="text-xs bg-indigo-900 text-indigo-200 px-2.5 py-1 rounded-full border border-indigo-700">Editing ID: {{ current_note['id'] }}</span>
            {% endif %}
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="newCanvas()" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-file"></i> New
            </button>
            <button onclick="saveNote()" class="bg-indigo-600 hover:bg-indigo-500 text-sm px-4 py-2 rounded-lg font-medium shadow-lg shadow-indigo-500/25 transition flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Save Note
            </button>
            <button onclick="toggleSidebar()" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-box-archive"></i> Saved Notes
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Toolbar Sidebar -->
        <aside class="w-20 bg-slate-800 border-r border-slate-700 flex flex-col items-center py-4 space-y-4 z-10 shadow-lg">
            <button onclick="setMode('select')" id="tool-select" title="Select / Move" class="tool-btn w-12 h-12 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-700 hover:text-white transition">
                <i class="fa-solid fa-arrow-pointer text-lg"></i>
            </button>
            <button onclick="setMode('draw')" id="tool-draw" title="Freehand Pen" class="tool-btn w-12 h-12 rounded-xl flex items-center justify-center text-indigo-400 bg-slate-700 transition">
                <i class="fa-solid fa-pencil text-lg"></i>
            </button>
            <button onclick="addText()" title="Add Text" class="w-12 h-12 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-700 hover:text-white transition">
                <i class="fa-solid fa-font text-lg"></i>
            </button>
            <button onclick="addShape('rect')" title="Add Rectangle" class="w-12 h-12 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-700 hover:text-white transition">
                <i class="fa-regular fa-square text-lg"></i>
            </button>
            <button onclick="addShape('circle')" title="Add Circle" class="w-12 h-12 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-700 hover:text-white transition">
                <i class="fa-regular fa-circle text-lg"></i>
            </button>
            <hr class="w-8 border-slate-700 my-2">
            
            <!-- Color Picker -->
            <div class="flex flex-col items-center space-y-1">
                <label class="text-[10px] text-slate-400 font-bold uppercase">Color</label>
                <input type="color" id="stroke-color" value="#6366f1" onchange="changeColor(this.value)" class="w-9 h-9 rounded-lg bg-transparent cursor-pointer border border-slate-600">
            </div>

            <!-- Brush Size -->
            <div class="flex flex-col items-center space-y-1 px-2">
                <label class="text-[10px] text-slate-400 font-bold uppercase">Size</label>
                <input type="range" id="brush-size" min="1" max="30" value="3" onchange="changeSize(this.value)" class="w-12 accent-indigo-500 cursor-pointer">
            </div>

            <hr class="w-8 border-slate-700 my-2">
            <button onclick="deleteSelected()" title="Delete Selected Item" class="w-12 h-12 rounded-xl flex items-center justify-center text-rose-400 hover:bg-rose-500/20 transition">
                <i class="fa-solid fa-trash text-lg"></i>
            </button>
            <button onclick="clearCanvas()" title="Clear Entire Canvas" class="w-12 h-12 rounded-xl flex items-center justify-center text-amber-400 hover:bg-amber-500/20 transition">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>
        </aside>

        <!-- Canvas Container -->
        <main class="flex-1 bg-slate-950 flex items-center justify-center overflow-auto relative" id="canvas-container">
            <canvas id="sketchpad"></canvas>
        </main>

        <!-- Saved Notes Drawer Modal / Sidebar -->
        <div id="sidebar" class="absolute right-0 top-0 h-full w-80 bg-slate-800 border-l border-slate-700 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-20 flex flex-col">
            <div class="p-4 border-b border-slate-700 flex items-center justify-between">
                <h2 class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-box-archive text-indigo-400"></i> Saved Sketches</h2>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="notes-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Notes injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Hidden field to hold current note ID if editing -->
    <input type="hidden" id="current-note-id" value="{% if current_note %}{{ current_note['id'] }}{% endif %}">

    <!-- Script to Handle Fabric Canvas & Flask API communication -->
    <script>
        // Initialize Fabric Canvas
        const container = document.getElementById('canvas-container');
        const canvas = new fabric.Canvas('sketchpad', {
            width: container.clientWidth,
            height: container.clientHeight,
            isDrawingMode: true
        });

        // Configure default brush
        canvas.freeDrawingBrush.color = '#6366f1';
        canvas.freeDrawingBrush.width = 3;

        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            canvas.setWidth(container.clientWidth);
            canvas.setHeight(container.clientHeight);
            canvas.renderAll();
        });

        // Tool Mode Management
        function setMode(mode) {
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('bg-slate-700', 'text-indigo-400'));
            if (mode === 'draw') {
                canvas.isDrawingMode = true;
                document.getElementById('tool-draw').classList.add('bg-slate-700', 'text-indigo-400');
            } else if (mode === 'select') {
                canvas.isDrawingMode = false;
                document.getElementById('tool-select').classList.add('bg-slate-700', 'text-indigo-400');
            }
        }

        function changeColor(color) {
            canvas.freeDrawingBrush.color = color;
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                activeObj.set('stroke', color);
                canvas.renderAll();
            }
        }

        function changeSize(size) {
            canvas.freeDrawingBrush.width = parseInt(size, 10);
        }

        function addText() {
            setMode('select');
            const text = new fabric.IText('Type your note here...', {
                left: 100,
                top: 100,
                fill: document.getElementById('stroke-color').value,
                fontSize: 24,
                fontFamily: 'sans-serif'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addShape(type) {
            setMode('select');
            let shape;
            const color = document.getElementById('stroke-color').value;
            if (type === 'rect') {
                shape = new fabric.Rect({ left: 120, top: 120, width: 120, height: 80, fill: 'transparent', stroke: color, strokeWidth: 3 });
            } else if (type === 'circle') {
                shape = new fabric.Circle({ left: 120, top: 120, radius: 50, fill: 'transparent', stroke: color, strokeWidth: 3 });
            }
            if (shape) {
                canvas.add(shape);
                canvas.setActiveObject(shape);
            }
        }

        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                activeObjects.forEach(obj => canvas.remove(obj));
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        function clearCanvas() {
            if (confirm("Are you sure you want to clear the entire canvas?")) {
                canvas.clear();
                canvas.backgroundColor = '#020617';
                canvas.renderAll();
            }
        }

        // Load Initial State if passed from backend
        {% if current_note and current_note['data'] %}
        window.addEventListener('DOMContentLoaded', () => {
            canvas.loadFromJSON({{ current_note['data']|tojson|safe }}, () => {
                canvas.renderAll();
            });
        });
        {% endif %}

        // Save Note to Flask backend
        async function saveNote() {
            const title = document.getElementById('note-title').value;
            const noteId = document.getElementById('current-note-id').value;
            const canvasData = JSON.stringify(canvas.toJSON());

            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: noteId ? parseInt(noteId) : null, title: title, data: canvasData })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('current-note-id').value = result.id;
                    alert('Sketch saved successfully!');
                }
            } catch (error) {
                console.error('Error saving note:', error);
                alert('Failed to save sketch.');
            }
        }

        // Toggle Saved Notes Drawer
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('translate-x-full');
            if (!sidebar.classList.contains('translate-x-full')) {
                fetchNotesList();
            }
        }

        // Fetch list of saved notes from backend
        async function fetchNotesList() {
            try {
                const response = await fetch('/notes');
                const notes = await response.json();
                const listContainer = document.getElementById('notes-list');
                listContainer.innerHTML = '';

                if (notes.length === 0) {
                    listContainer.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">No saved sketches yet.</p>`;
                    return;
                }

                notes.forEach(note => {
                    const item = document.createElement('div');
                    item.className = "bg-slate-700/50 p-3 rounded-xl border border-slate-600 flex items-center justify-between group hover:border-indigo-500 transition";
                    item.innerHTML = `
                        <div class="cursor-pointer flex-1" onclick="loadNote(${note.id})">
                            <h3 class="font-semibold text-sm text-white">${note.title}</h3>
                            <p class="text-[10px] text-slate-400">${note.created_at}</p>
                        </div>
                        <button onclick="deleteNote(${note.id}, event)" class="text-slate-400 hover:text-rose-400 p-2 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (error) {
                console.error('Error fetching notes list:', error);
            }
        }

        function loadNote(id) {
            window.location.href = `/?id=${id}`;
        }

        async function newCanvas() {
            if (confirm("Start a new sketch? Make sure your current changes are saved.")) {
                window.location.href = `/`;
            }
        }

        async function deleteNote(id, event) {
            event.stopPropagation();
            if (confirm("Delete this saved sketch?")) {
                try {
                    const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        fetchNotesList();
                        const currentId = document.getElementById('current-note-id').value;
                        if (currentId == id) {
                            window.location.href = '/';
                        }
                    }
                } catch (error) {
                    console.error('Error deleting note:', error);
                }
            }
        }
    </script>
</body>
</html>
